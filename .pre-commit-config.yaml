# pre-commit（コミット直前の自動検査）。実行は `uvx pre-commit run --all-files`。
# ローカルと CI が同じ共通の検証コマンド（uv run）を叩く＝完了の定義を一致させる。
# 既定では全フックが全ステージで走るため、commit-msg を install すると check・gitleaks が
# コミットごとに二重実行される。既存フックは pre-commit ステージに固定する（test_commit_lint が検査）。
default_stages: [pre-commit]
repos:
  - repo: local
    hooks:
      - id: harness-check-standard
        name: 共通の検証コマンド（standard＝ruff＋mypy＋作業単位の検査）
        entry: uv run check --level standard
        language: system
        pass_filenames: false
        always_run: true
      # コミットメッセージの作業単位 ID 検査（T-0101。ID の正本＝pm.load_tree・免除は接頭辞リストのみ）。
      # 有効化には `pre-commit install --hook-type commit-msg` が必要（既定の install では素通り）。
      - id: commit-msg-id-lint
        name: コミットメッセージの作業単位 ID 検査（work/ 実在 ID を冒頭に）
        entry: uv run commit-msg-lint
        language: system
        stages: [commit-msg]
  # 秘密情報検出＝gitleaks を採用（第一候補どおり。detect-secrets は実測で results/ のデータ指紋
  # （sha256）を偽陽性 7 件検出したため不採用）。CI もこの同じフック id を回す（tests/test_guardrails.py が検査）。
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        # 公式 entry（`gitleaks git --staged`）はステージ差分だけを走査し、CI のクリーンチェックアウト
        # （差分ゼロ）では何も走査しない（実測で確認）。ローカル・CI とも同じ入口で実効走査させるため、
        # 作業ツリー全走査（dir モード。実測 0.1 秒）に entry を上書きする。ドットファイル（`.env` 含む）は
        # 走査される（実測：`.env`/`.env.probe`/`.probedir/key.txt` すべて検出）。`.venv` 等が走査対象外なのは
        # gitleaks 既定の path allowlist による別機序で、ドット始まりだからではない。
        # 追跡外・ステージ外のファイルの鍵形文字列でもコミットを止める（免除は `.gitleaksignore`＝理由必須）。
        # 偽陽性の免除は `.gitleaksignore`（fingerprint 単位・理由コメント必須＝test_guardrails が検査）。
        entry: gitleaks dir --redact --no-banner --verbose .
        pass_filenames: false
  # 検査委譲の関門：GitHub Actions workflow の汎用形式（構文・式・cron・schema 準拠）は
  # 既製バリデータへ委譲し、自前 lint（schedule_lint/ci_lint）はプロジェクト固有意味論だけに残す。
  # 対象は当リポの workflow 雛形（templates/ci/.github/workflows/*.yml・templates/schedule/monitor.yml）。
  # 公式既定の `files: ^\.github/workflows/` のままだと当リポには実workflow が無く vacuous pass（何も
  # 走査しない）になるため、`files:` を templates/ 側へ上書きする（L-015 の教訓）。k8s（templates/serve/k8s/*.yaml）・
  # compose（templates/serve/docker-compose.serve.yml）は workflow でないので対象に含めない。
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        files: ^(templates/ci/\.github/workflows/.*\.ya?ml|templates/schedule/monitor\.yml)$
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.37.4
    hooks:
      - id: check-jsonschema
        name: GitHub Actions workflow の schema 準拠（vendor.github-workflows）
        args: [--builtin-schema, vendor.github-workflows]
        files: ^(templates/ci/\.github/workflows/.*\.ya?ml|templates/schedule/monitor\.yml)$
