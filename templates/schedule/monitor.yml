# time-based routine：agent monitor の定期実行（trigger＝schedule.cron）
# 停止（stop）＝ Actions 画面で Disable workflow（gh workflow disable でも可）、
# または本ファイルを削除。手順の正本は README.md と docs/agent.md の time-based 節。
name: agent-monitor-routine
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch: {}
permissions:
  contents: read
  issues: write
concurrency:
  group: agent-monitor-routine
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras
      - run: uv run agent monitor --file-issue
