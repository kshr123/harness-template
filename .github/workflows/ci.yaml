# CI（検証の最終段）。ローカルと同じ共通の検証コマンド（uv run verify）を使う＝完了の定義を一致させる。
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: uv をセットアップ
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
      - name: 依存を同期（データサイエンスの上乗せも含める）
        run: uv sync --extra ds
      - name: 共通の検証コマンド（完了判定）
        run: uv run verify
