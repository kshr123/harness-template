# 検証の登録先。共通の検証コマンド（uv run check / verify）がこれを読む。
# レベル：fast（速い・コミット前の一部）→ standard（コミット前）→ full（CI・完了判定）。
# プロジェクト管理の検査（参照チェック・STATUS 一致）はコードに内蔵（どのレベルでも走る）。

[fast]
commands = [
    ["ruff", "format", "--check", "."],
    ["ruff", "check", "."],
]

[standard]
commands = [
    ["mypy"],
]

[full]
commands = [
    ["pytest", "-q"],
]
