# 検証の登録先。共通の検証コマンド（uv run check / verify）がこれを読む。
# 段階（level）＝検証の深さ。fast（編集中）→ standard（コミット前）→ full（CI・完了判定）。累積で走る。
# 各段階の pytest はテストの目印（marker）で範囲を絞る：fast=unit / standard=integration / full=e2e。
# いずれも slow は外す（重い本規模実行は門番に載せない。詳細は docs/method.md C）。
# 不変条件の検査（参照・完了↔検証・課題・テーブル定義）はコードに内蔵（どの段階でも走る）。

[fast]
commands = [
    ["ruff", "format", "--check", "."],
    ["ruff", "check", "."],
    ["pytest", "-q", "-m", "unit and not slow"],
]

[standard]
commands = [
    ["mypy"],
    # browser は除外＝既定の verify で実 Chrome を毎回起動しない（描画の幾何は Python 計算で
    # test_deliver_geometry.py が検証済み・JS/DOM の振る舞いは CI の browser 実行が必須にする）。
    ["pytest", "-q", "-m", "integration and not slow and not browser"],
]

[full]
commands = [
    ["pytest", "-q", "-m", "e2e and not slow"],
]
