[project]
name = "harness"
version = "0.1.0"
description = "AIコーディング中心の汎用開発ハーネス（土台）。プロジェクト管理と検証の共通入口。"
requires-python = ">=3.14"
dependencies = [
    "typer>=0.15",
    "pydantic>=2.11",
    "pydantic-settings>=2.7",
    "ruamel.yaml>=0.18",
    "python-frontmatter>=1.1",
    "jsonschema>=4.23",
]

# データサイエンスの上乗せ（プロファイル）。土台の中核とは分け、案件に応じて足す。
# インストール例: uv sync --extra ds
[project.optional-dependencies]
ds = [
    "altair>=5.4",
    "marimo>=0.9",
    "numpy>=2.1",
    "polars>=1.17",
    # 業界標準を再発明しない：メトリクス・交差検証の分割・スケーリングは scikit-learn を使う。
    "scikit-learn>=1.6",
]
# 追加モデルの optional 依存（ライブラリ名＝extra 名）。入れれば `data models` に増える（条件登録）。
# 入れなくても ds は全機能動く（sklearn の hist_gb で勾配ブースティングは賄える）。導入例: uv sync --extra ds --extra lightgbm
lightgbm = ["lightgbm>=4.5"]
# 古典時系列（ARIMA/SARIMA/ETS）の別経路（forecast.py）。入れれば `data models` に [timeseries] が増える。
statsmodels = ["statsmodels>=0.14"]

[project.scripts]
# 共通の検証コマンドと、プロジェクト管理の入口。実体はこのCLI。make は使わない（任意エイリアスのみ）。
verify = "harness.cli:verify_main"
check = "harness.cli:check_main"
status = "harness.cli:status_main"
task-lint = "harness.cli:task_lint_main"
issue = "harness.cli:issue_main"
data = "harness.cli:data_main"
changelog = "harness.cli:changelog_main"

[dependency-groups]
dev = [
    "ruff>=0.9",
    "mypy>=1.14",
    "pytest>=8.3",
    "hypothesis>=6.120",
    "pre-commit>=4.0",
]
# ty（Astral の高速型チェッカー）は beta のため任意・ローカル用。
# 使う場合のみ: uv add --dev --prerelease=allow ty


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness"]

[tool.ruff]
# 日本語の説明・メッセージは長くなりやすいため 120（L-003 の判断）。
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# marimo のセルは末尾の式を「表示」に使う（B018＝無用な式、ではない）。ビュー雛形だけの除外。
"notebooks/*.py" = ["B018"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
# 型スタブを提供していない外部ライブラリ（frontmatter・PyYAML・scikit-learn・LightGBM）。
module = ["frontmatter", "yaml", "sklearn.*", "lightgbm.*", "statsmodels.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# 未登録のマーカーは失敗にする（誤字・野良マーカーを防ぐ）。full は除外なしで全実行。
addopts = "--strict-markers"
markers = [
    "unit: 依存の少ない純粋な単体テスト（既定・速い）",
    "integration: 複数の部品の結線（ファイル・設定をまたぐ）",
    "e2e: 実験の一巡のスモーク（--test 規模。ネットワーク・サーバ無し）",
    "slow: 実行が重いテスト（check/verify は全段階で除外＝門番に載せない。回すときは手動で `-m slow`）",
]
