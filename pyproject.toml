[project]
name = "harness"
version = "0.1.0"
description = "AIコーディング中心の汎用開発ハーネス（汎用コア）。PM層＋検証の共通入口。"
requires-python = ">=3.14"
dependencies = [
    "typer>=0.15",
    "pydantic>=2.11",
    "pydantic-settings>=2.7",
    "ruamel.yaml>=0.18",
    "python-frontmatter>=1.1",
    "jsonschema>=4.23",
]

[project.scripts]
# 共通の検証コマンド（check共通IF）とPM層の入口。実体はこのCLI。make は使わない（任意エイリアスのみ）。
verify = "harness.cli:verify_main"
check = "harness.cli:check_main"
status = "harness.cli:status_main"
task-lint = "harness.cli:task_lint_main"
changelog = "harness.cli:changelog_main"

[dependency-groups]
dev = [
    "ruff>=0.9",
    "mypy>=1.14",
    "pytest>=8.3",
    "hypothesis>=6.120",
    "pre-commit>=4.0",
]
# ty（Astral の高速型チェッカー）は beta のため任意・ローカル用。
# 使う場合のみ: uv add --dev --prerelease=allow ty


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness"]

[tool.ruff]
# 日本語の説明・メッセージは長くなりやすいため 120（L-003 の判断）。
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
# python-frontmatter は型スタブを提供していない（外部ライブラリ）。
module = ["frontmatter"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
