[project]
name = "harness"
version = "0.1.0"
description = "AIコーディング中心の汎用開発ハーネス（土台）。プロジェクト管理と検証の共通入口。"
requires-python = ">=3.14"
dependencies = [
    "typer>=0.15",
    "pydantic>=2.11",
    "pydantic-settings>=2.7",
    "ruamel.yaml>=0.18",
    "python-frontmatter>=1.1",
    "jsonschema>=4.23",
]

# データサイエンスの上乗せ（プロファイル）。土台の中核とは分け、案件に応じて足す。
# インストール例: uv sync --extra ds
[project.optional-dependencies]
ds = [
    "numpy>=2.1",
    "polars>=1.17",
    # 業界標準を再発明しない：メトリクス・交差検証の分割・スケーリングは scikit-learn を使う。
    "scikit-learn>=1.6",
]

[project.scripts]
# 共通の検証コマンドと、プロジェクト管理の入口。実体はこのCLI。make は使わない（任意エイリアスのみ）。
verify = "harness.cli:verify_main"
check = "harness.cli:check_main"
status = "harness.cli:status_main"
task-lint = "harness.cli:task_lint_main"
issue = "harness.cli:issue_main"
data = "harness.cli:data_main"
changelog = "harness.cli:changelog_main"

[dependency-groups]
dev = [
    "ruff>=0.9",
    "mypy>=1.14",
    "pytest>=8.3",
    "hypothesis>=6.120",
    "pre-commit>=4.0",
]
# ty（Astral の高速型チェッカー）は beta のため任意・ローカル用。
# 使う場合のみ: uv add --dev --prerelease=allow ty


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness"]

[tool.ruff]
# 日本語の説明・メッセージは長くなりやすいため 120（L-003 の判断）。
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
# 型スタブを提供していない外部ライブラリ（frontmatter・PyYAML・scikit-learn）。
module = ["frontmatter", "yaml", "sklearn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# 未登録のマーカーは失敗にする（誤字・野良マーカーを防ぐ）。full は除外なしで全実行。
addopts = "--strict-markers"
markers = [
    "unit: 依存の少ない純粋な単体テスト（既定・速い）",
    "integration: 複数の部品の結線（ファイル・設定をまたぐ）",
    "e2e: 実験の一巡のスモーク（--test 規模。ネットワーク・サーバ無し）",
    "slow: 実行が重いテスト（full では走らせる。日常は選別してもよい）",
]
