[project]
name = "harness"
version = "0.1.0"
description = "AIコーディング中心の汎用開発ハーネス（土台）。プロジェクト管理と検証の共通入口。"
requires-python = ">=3.14"
dependencies = [
    "typer>=0.15",
    "pydantic>=2.11",
    "python-frontmatter>=1.1",
    # YAML の読み書きは cli.py・ds/{schema,store,models}.py で直接使う（import yaml）。
    # 以前は python-frontmatter の推移的依存で偶然入っていただけ＝明示宣言に直す（宣言と実態の一致）。
    "pyyaml>=6.0",
]

# データサイエンスの上乗せ（プロファイル）。土台の中核とは分け、案件に応じて足す。
# インストール例: uv sync --extra ds
[project.optional-dependencies]
ds = [
    "altair>=5.4",
    "marimo>=0.9",
    "numpy>=2.1",
    # features.py が join(nulls_equal=, maintain_order=)・explode(empty_as_null=) を使うため 1.42 以上。
    "polars>=1.42",
    # 業界標準を再発明しない：メトリクス・交差検証の分割・スケーリングは scikit-learn を使う。
    # pipeline.py が TargetEncoder(cv=KFold(...))（分割器オブジェクト渡し）を使うため 1.9 以上（1.8 以前は int のみ）。
    "scikit-learn>=1.9",
]
# 追加モデルの optional 依存（ライブラリ名＝extra 名）。入れれば `data models` に増える（条件登録）。
# 入れなくても ds は全機能動く（sklearn の hist_gb で勾配ブースティングは賄える）。導入例: uv sync --extra ds --extra lightgbm
lightgbm = ["lightgbm>=4.5"]
# 古典時系列（ARIMA/SARIMA/ETS）の別経路（forecast.py）。入れれば `data models` に [timeseries] が増える。
statsmodels = ["statsmodels>=0.14"]
# モデルの安全な保存形式（pickle の代替）。入れれば FORMATS に "skops" が増える（条件登録）。
# 導入例: uv sync --extra ds --extra skops
skops = ["skops>=0.11"]
# 可搬な配信形式（本の中心＝ONNX）。入れれば FORMATS に "onnx" が増える（条件登録・sklearn 尾部のみ変換）。
# skl2onnx が変換・onnxruntime が読込・onnx を metadata_props で直接触るため 3 つ明示。導入例: uv sync --extra ds --extra onnx
onnx = ["skl2onnx>=1.20", "onnxruntime>=1.27", "onnx>=1.22"]
# 配信プロファイル（harness.serve）。champion を FastAPI で出す。ds と併用: uv sync --extra ds --extra serve
# 配信イメージを可搬にするなら onnx も: uv sync --extra ds --extra serve --extra onnx
serve = ["fastapi>=0.139", "uvicorn>=0.50"]
# LLMOps プロファイル（harness.agent）。実プロバイダ（Anthropic SDK）＋配信（fastapi/uvicorn＝agent serve）。
# verify 経路は dummy/cassette で無ネットワークのまま。導入例: uv sync --extra agent
agent = ["anthropic>=0.40", "fastapi>=0.139", "uvicorn>=0.50"]

[project.scripts]
# 共通の検証コマンドと、プロジェクト管理の入口。実体はこのCLI。make は使わない（任意エイリアスのみ）。
verify = "harness.cli:verify_main"
check = "harness.cli:check_main"
status = "harness.cli:status_main"
task-lint = "harness.cli:task_lint_main"
# 複製後の初期化（案件領域を白紙化して verify 緑の出発点に戻す・fork 専用）。正本は docs/template-copy.md。
init-project = "harness.cli:init_project_main"
issue = "harness.cli:issue_main"
# data は DS プロファイルの CLI（プロファイル境界。中核 CLI とはモジュールを分ける）。
data = "harness.ds.cli:data_main"
changelog = "harness.cli:changelog_main"
# 昇格の判定（GATES レジストリ）のカタログ。中核の部品なので ds/agent のどちらからも同じものが見える。
gates = "harness.cli:gates_main"
# docs/core.md の自動生成節（検査の一覧・言語ツール）を作り直す。最新かどうかは verify（doc_sync）が検査する。
doc-sync = "harness.cli:doc_sync_main"
# commit-msg フックの実体（引数＝git が渡すメッセージファイルのパス。有効化は AGENTS.md コマンド節参照）。
commit-msg-lint = "harness.cli:commit_msg_lint_main"
# 配信プロファイルの CLI（champion を FastAPI で出す）。extra serve が要る（無ければ案内して exit 1）。
serve = "harness.serve.cli:serve_main"
# LLMOps プロファイルの CLI（AgentSpec の評価・カタログ）。verify 経路（dummy）は extra 無しで動く。
agent = "harness.agent.cli:agent_main"

[dependency-groups]
dev = [
    "ruff>=0.9",
    "mypy>=1.14",
    "pytest>=8.3",
    "hypothesis>=6.120",
    "pre-commit>=4.0",
    # FastAPI の TestClient（starlette）が使う。配信プロファイルのテスト用（ランタイム extra には入れない）。
    "httpx>=0.28",
]
# ty（Astral の高速型チェッカー）は beta のため任意・ローカル用。
# 使う場合のみ: uv add --dev --prerelease=allow ty


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness"]

[tool.ruff]
# 日本語の説明・メッセージは長くなりやすいため 120（L-003 の判断）。
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# marimo のセルは末尾の式を「表示」に使う（B018＝無用な式、ではない）。ビュー雛形だけの除外。
"notebooks/*.py" = ["B018"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
# 型スタブを提供していない外部ライブラリ（frontmatter・PyYAML・scikit-learn・LightGBM）。
module = ["frontmatter", "yaml", "sklearn.*", "lightgbm.*", "statsmodels.*", "scipy.*", "skops.*", "skl2onnx.*", "onnxruntime.*", "onnx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# 未登録のマーカーは失敗にする（誤字・野良マーカーを防ぐ）。full は除外なしで全実行。
addopts = "--strict-markers"
markers = [
    "unit: 依存の少ない純粋な単体テスト（既定・速い）",
    "integration: 複数の部品の結線（ファイル・設定をまたぐ）",
    "e2e: 実験の一巡のスモーク（--test 規模。ネットワーク・サーバ無し）",
    "slow: 実行が重いテスト（check/verify は全段階で除外＝門番に載せない。回すときは手動で `-m slow`）",
]
