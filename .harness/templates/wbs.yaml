# 顧客向け WBS の案件固有の上書き（`docs/wbs.yaml` に置く）。
#
# **日程・階層・状態の正本はここではない**。それらは work/ の作業単位の frontmatter にある
# （start・due・effort_days・milestone・status）。ここに書くのは、作業単位に属さないものだけ。
# WBS 番号・営業日数・進捗率・親の日程を書く欄は無い（毎回導出される）。
#
# このファイルは無くても動く（暦は土日だけ・節の構成は work/ の木をそのまま使う）。
# 書き方の正本は docs/deliver.md、手順は .claude/skills/wbs/SKILL.md。

project: <案件名>
client: <提出先>

calendar:
  country: JP # 祝日を見る国。書かなければ土日だけを非稼働日にする。
  extra_holidays: [] # 会社・クライアントの休業日（例 [2026-08-13, 2026-08-14]）
  extra_workdays: [] # 振替出勤（非稼働日の判定を打ち消す。こちらが優先）
# 案件の名簿（画面のチーム・担当はここから選ぶ。新しい名前を画面で入れると、ここにも足される）。
teams: []
members: []

# 顧客向けの節（フェーズ）。顧客の言葉と work/ の構造がずれるときだけ書く。
# 書かなければ work/ 直下の単位がそのまま第 1 階層になる。
# sections:
#   - name: フェーズ1 要件定義
#     team: コンサル
#     entries:
#       - work: EP-01 # 作業単位を指す（日程・状態はそこから導出。書く欄は無い）
#       - row: W-001 # 手動行を指す
#
# work/ に置けない行だけ（クライアントの承認待ち・定例会議・先方の作業）。
# 導出元が無いので status は必須。
# rows:
#   - id: W-001
#     name: 要件定義書のクライアント承認
#     team: クライアント
#     assignees: [先方PMO]
#     start: 2026-08-20
#     due: 2026-08-21
#     status: todo
#     depends_on: [T-0003]
#
# 顧客向けに載せない作業単位（社内都合の作業など）。節の構成が覆っていない単位は検査に失敗するので、
# 外すならここに明示する（黙って消えるのを止める）。
# exclude: []
