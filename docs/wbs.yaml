# 顧客向け WBS の案件固有の上書き（案件領域。fork したら書き換える）。
# 日程・階層・状態の正本はここではなく work/ の作業単位。ここに書くのは、作業単位に属さないものだけ。
# 書き方の正本は docs/deliver.md。無くても動く（暦は土日だけ・節構成は work/ の木をそのまま使う）。

project: 開発ハーネス（この基盤そのものを最初の案件として扱う）

calendar:
  country: JP # 祝日を見る国。書かなければ土日だけを非稼働日にする。
  extra_holidays: [] # 会社・クライアントの休業日
  extra_workdays: [] # 振替出勤（非稼働日の判定を打ち消す。こちらが優先）
# sections を書かない＝work/ の木をそのまま顧客向けの並びに使う（節構成の翻訳が要るときだけ書く）。
