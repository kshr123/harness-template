id: synthetic
description: 二値分類の合成データ。1行が1件のサンプルを表す。
layer: raw
role: cleaned
source: harness.ds.data.generate_synthetic（seed から再現できる）
primary_key: [id]
target_column: y  # 特徴量テーブル（role: feature）に y 列が同乗したら ValueError で止まる（T-0205）
columns:
  - name: id
    dtype: Int64
    nullable: false
    unique: true
    description: 行の識別子
  - name: x1
    dtype: Float64
    nullable: false
    description: 特徴量1
  - name: x2
    dtype: Float64
    nullable: false
    description: 特徴量2
  - name: y
    dtype: Int64
    nullable: false
    allowed_values: [0, 1]
    description: ラベル（0 または 1）
